<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>FleetOS Command Center</title>
    <link rel="icon" href="/transport.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
    <link rel="stylesheet" href="app.css"/>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <a class="brand" href="#/command">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h2l1.5-5h9L17 17h2"/><path d="M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM15 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/><path d="M8 12V7h8l3 5"/></svg>
            </span>
            <span class="brand-text">FleetOS<small>Command Center</small></span>
        </a>
        <nav class="nav" id="nav">
            <a href="#/command" data-route="command"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg><span>Command</span></a>
            <a href="#/jobs" data-route="jobs"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Jobs</span><em id="nav-jobs"></em></a>
            <a href="#/fleet" data-route="fleet"><svg viewBox="0 0 24 24"><path d="M1 13h13V5H1zM14 9h5l4 4v4h-9zM5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg><span>Fleet</span><em id="nav-fleet" class="warn"></em></a>
            <a href="#/payroll" data-route="payroll"><svg viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Payroll</span></a>
        </nav>
        <button class="palette-hint" id="open-palette" type="button">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <span>Search anything</span><kbd>⌘K</kbd>
        </button>
        <div class="sidebar-foot">
            <a class="classic" href="/classic">Classic UI →</a>
            <div class="user">
                <span class="avatar" id="user-avatar">A</span>
                <div><strong id="user-name">…</strong><small>Fleet manager</small></div>
                <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme">
                    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
                <form method="post" action="/logout" id="logout-form">
                    <input type="hidden" name="_csrf" id="logout-csrf"/>
                    <button class="icon-btn" type="submit" title="Log out">
                        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <h1 id="page-title">Command</h1>
                <p id="page-sub">Live picture of your fleet</p>
            </div>
            <div class="topbar-right">
                <span class="live-dot"></span><span id="clock" class="mono"></span>
            </div>
        </header>
        <section id="view" class="view"><div class="loading">Loading fleet…</div></section>
    </main>
</div>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
    <button class="icon-btn drawer-close" id="drawer-close" type="button" title="Close (Esc)">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div id="drawer-body"></div>
</aside>

<div class="palette" id="palette" aria-hidden="true">
    <div class="palette-box">
        <input id="palette-input" placeholder="Jump to a driver, truck, trailer, job, or page…" autocomplete="off"/>
        <ul id="palette-list"></ul>
        <footer><kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>↵</kbd> open <kbd>esc</kbd> close</footer>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
