# Profile-neutral settings shared by every environment.
# Run with SPRING_PROFILES_ACTIVE=dev for local work or =prod for deployments.
# There is deliberately no default profile: without one, the datasource and LDAP
# placeholders stay unresolved and startup fails instead of guessing an environment.
spring.datasource.driverClassName=${OPENFLEET_DATASOURCE_DRIVER:com.mysql.jdbc.Driver}
spring.jpa.hibernate.ddl-auto = update

# LDAP directory layout (not environment-specific, overridable per deployment).
openfleet.ldap.user-dn-pattern=${OPENFLEET_LDAP_USER_DN_PATTERN:uid={0},ou=managers}
openfleet.ldap.group-search-base=${OPENFLEET_LDAP_GROUP_SEARCH_BASE:ou=managers}
openfleet.ldap.password-attribute=${OPENFLEET_LDAP_PASSWORD_ATTRIBUTE:userPassword}

logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR

server.error.whitelabel.enabled=false
