spring.ldap.embedded.ldif=classpath:test-server.ldif
spring.ldap.embedded.base-dn=dc=openfleet,dc=org
spring.ldap.embedded.port=8389

# Datasource: supplied by the deployment (environment variables or secrets).
# No fallback values on purpose: a missing value must fail startup instead of
# silently connecting with development credentials.
spring.datasource.url=${OPENFLEET_DATASOURCE_URL}
spring.datasource.username=${OPENFLEET_DATASOURCE_USERNAME}
spring.datasource.password=${OPENFLEET_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=${OPENFLEET_DATASOURCE_DRIVER:com.mysql.jdbc.Driver}
spring.jpa.hibernate.ddl-auto = update

# LDAP authentication boundary consumed by WebSecurityConfig.
openfleet.ldap.urls=${OPENFLEET_LDAP_URLS}
openfleet.ldap.base-dn=${OPENFLEET_LDAP_BASE_DN}
openfleet.ldap.user-dn-pattern=${OPENFLEET_LDAP_USER_DN_PATTERN:uid={0},ou=managers}
openfleet.ldap.group-search-base=${OPENFLEET_LDAP_GROUP_SEARCH_BASE:ou=managers}
openfleet.ldap.password-attribute=${OPENFLEET_LDAP_PASSWORD_ATTRIBUTE:userPassword}

logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR

server.error.whitelabel.enabled=false
