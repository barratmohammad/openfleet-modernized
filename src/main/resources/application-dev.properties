# Local development profile. Defaults match docker-compose.yml test services and
# are NOT production credentials. Any value can be overridden via OPENFLEET_* env vars.
spring.ldap.embedded.ldif=classpath:test-server.ldif
spring.ldap.embedded.base-dn=dc=openfleet,dc=org
spring.ldap.embedded.port=8389

spring.datasource.url=${OPENFLEET_DATASOURCE_URL:jdbc:mysql://localhost:3306/openfleet?useSSL=false}
spring.datasource.username=${OPENFLEET_DATASOURCE_USERNAME:openfleet_test}
spring.datasource.password=${OPENFLEET_DATASOURCE_PASSWORD:openfleet_test_only}

openfleet.ldap.urls=${OPENFLEET_LDAP_URLS:ldap://localhost:8389/}
openfleet.ldap.base-dn=${OPENFLEET_LDAP_BASE_DN:dc=openfleet,dc=org}

# Demo data for local runs (idempotent, dates relative to today).
spring.datasource.data=classpath:seed/demo-data.sql
